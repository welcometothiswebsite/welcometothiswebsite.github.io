<title>dont open without clicking game</title>
<script>
function openGame(fetchPath) {
    const newTab = window.open('about:blank', '_blank');

    newTab.document.open();
    newTab.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Game Loader</title>
            <style>
                body {
                    margin: 0;
                    font-family: sans-serif;
                }
                #content-container {
                    width: 100vw;
                    height: 100vh;
                    overflow: auto;
                }
            </style>
        </head>
        <body>
            <div id="content-container">Loading...</div>

            <script>
                fetch('${fetchPath}')
                    .then(res => {
                        if (!res.ok) throw new Error(res.status);
                        return res.text();
                    })
                    .then(html => {
                        document.getElementById('content-container').innerHTML = html;
                    })
                    .catch(err => {
                        document.getElementById('content-container').innerHTML =
                            '<p style="color:red;">Failed to load content</p>';
                        console.error(err);
                    });
            <\/script>
        </body>
        </html>
    `);
    newTab.document.close();
}
</script>
