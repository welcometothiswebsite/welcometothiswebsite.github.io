<!DOCTYPE html>
<html>
<head>
    <title>Calculator Game</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <style>
        /* Celebration animation styles */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .celebration h1 {
            font-size: 3em;
            color: gold;
            text-shadow: 0 0 10px yellow;
            margin-bottom: 20px;
        }
        .celebration p {
            font-size: 1.5em;
            margin: 10px 0;
        }
        .celebration button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px;
        }
        /* Mod menu styles */
        .mod-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #222;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 10000;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px #0f0;
            width: 300px;
        }
        .mod-menu h2 {
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }
        .mod-menu button {
            background-color: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            width: 100%;
        }
        .mod-menu button:hover {
            background-color: #0f0;
            color: #000;
        }
        .mod-menu-close {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #0f0;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
    <script>
        const endings = {
            "giveme-ending": "Free Free Ending",
            "new-tab": "New Tab Ending",
            "error-404": "Error 404 Ending",
            "space-exploration": "Astronaut Ending",
            "alien-invasion": "Alien Takeover Ending",
            "time-travel": "Time Traveler Ending",
            "hacker-mode": "[Hacker] [Mode] Ending",
            "hidden-treasure": "Pirate Treasure Ending",
            "haunted-house": "Haunted House Ending",
            "robot-uprising": "AI Overlord Ending",
            "mario-ending": "Mario Ending",
            "temu-ending": "[TEMU] [Ending]",
            "golden-bar": "Golden Bar Ending",
            "pizza-isyummy": "Pizza Ending",
            "party-time": "[Party] [Time] Ending",
            "google-search": "Google Search Ending",
            "a6bc0@a-pp0?@33z": "a6bc0@a pp0?@33z Ending",
            "free-one": "Free One Ending",
            "calculator-game": "The Game Name Ending",
            "subscribetomy-channel@josephasn": "Subscribe Ending",
            "apple-ishealthy": "[Apple] [IsHealthy] Ending",
            "sad-ending": "[Sad] [Ending] Ending",
            "rubber-ducky": "Rubber Ducky Ending",
            "golden-cheese?": "Golden Cheese? Ending",
            "end-ings": "End Ings Ending",
            "taco-ending": "Taco Ending",
            "google-.com": "Google .com Ending",
            "school-sucks": "School Sucks Ending",
            "this-website": "This Website Ending",
            "games-arefun": "Games Fun Ending",
            "404-life": "404 Life Not Found Ending",
            "infinite-loop": "Infinite Loop Ending",
            "ctrlalt-del": "Ctrl+Alt+Del Ending",
            "tobe-continued": "To Be Continued...? Ending",
            "winat-cost": "You Win... But At What Cost? Ending",
            "rickroll-ending": "Rickroll Ending",
            "shrek-love": "Shrek is Love Ending",
            "trollface-win": "Trollface Win Ending",
            "among-us": "Among Us Sus Ending",
            "dogecoin-tothemoon": "Dogecoin to the Moon Ending",
            "mario-gameover": "Mario Game Over Ending",
            "sonic-rings": "Sonic Rings Lost Ending",
            "dark-souls": "Dark Souls 'You Died' Ending",
            "pacman-ghost": "Pac-Man Ghost Chase Ending",
            "tetris-blocked": "Tetris Blocked Ending",
            "matrix-glitch": "The Matrix Glitch Ending",
            "backrooms-ending": "Backrooms Ending",
            "everything-cake": "Everything is Cake Ending",
            "simulation-failed": "Simulation Failed Ending",
            "youare-avillain": "You Are A Villain Ending",
            "game-deleted": "Game Deleted Ending",
            "virus-detected": "Virus Detected Ending",
            "corrupt-save": "Corrupt Save File Ending",
            "infinite-ad": "Infinite Ad Break Ending",
            "keyboard-notfound": "Keyboard Not Found Ending",
            "100-completion": "100% Completion Ending",
            "dev-room": "Secret Developer Room Ending",
            "unlimited-power": "Unlimited Power Ending",
            "pizza-party": "Eternal Pizza Party Ending",
            "played-yourself": "You Played Yourself Ending",
            "real-endingfriends": "The Real Ending Was Friends Ending",
            "not-agame": "This Isn't Even a Game Ending",
            "endor-isit": "The End... Or Is It? Ending",
            "wasting-time": "Achievement Unlocked: Wasting Time Ending",
            "konami-code": "Konami Code Ending",
            "zelda-secret": "Zelda Secret Ending",
            "minecraft-creeper": "Minecraft Creeper Ending",
            "half-life3": "Half-Life 3 Confirmed Ending",
            "undertale-pacifist": "Undertale Pacifist Ending",
            "jump-scare": "Jump Scare Ending",
            "black-hole": "Black Hole Ending",
            "white-hole": "White Hole Ending",
            "???-???": "???"
        };
        // Final ending (special)
        const finalEndingKey = "you-won";
        const finalEndingName = "You won!";

        function calculate() {
            const num1Input = document.getElementById('input1').value.trim();
            const num2Input = document.getElementById('input2').value.trim();

            const num1 = parseFloat(num1Input);
            const num2 = parseFloat(num2Input);

            if (!isNaN(num1) && !isNaN(num2)) {
                const result = num1 * num2;
                document.getElementById('result').innerText = `Result: ${result}`;
                return;
            }

            const key = `${num1Input}-${num2Input}`;

            // Special handling for final ending
            if (key === finalEndingKey) {
                let savedEndings = JSON.parse(localStorage.getItem("endings")) || [];
                if (savedEndings.length === Object.keys(endings).length) {
                    unlockEnding(finalEndingName);
                    showFinalCelebration();
                    replacePageWithEnding(finalEndingName, false);
                } else {
                    alert("❌ You must unlock all other endings before typing 'you-won'!");
                }
                return;
            }

            // Normal endings
            if (endings[key]) {
                unlockEnding(endings[key]);
                replacePageWithEnding(endings[key], false);
            } else {
                alert("[error][404] Invalid input! Please enter valid numbers or ending codes.");
            }

            checkForCompletion();
        }

        function showCompletionCelebration() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.innerHTML = `
                <h1>🎉 CONGRATULATIONS! 🎉</h1>
                <p>You've unlocked all ${Object.keys(endings).length} endings!</p>
                <p>Now unlock the final ending by typing "you-won" in the calculator!</p>
                <button onclick="document.body.removeChild(this.parentNode);">Continue</button>
            `;
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.width = Math.random() * 15 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                celebration.appendChild(confetti);
            }
            document.body.appendChild(celebration);
        }

        function showFinalCelebration() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.innerHTML = `
                <h1>🏆 YOU WON! 🏆</h1>
                <p>You've unlocked ALL ${Object.keys(endings).length + 1} endings!</p>
                <p>You are the ultimate champion!</p>
                <button onclick="document.body.removeChild(this.parentNode);">Continue</button>
            `;
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.width = Math.random() * 20 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                celebration.appendChild(confetti);
            }
            document.body.appendChild(celebration);
        }

        function unlockEnding(ending) {
            let savedEndings = JSON.parse(localStorage.getItem("endings")) || [];
            if (!savedEndings.includes(ending)) {
                savedEndings.push(ending);
                localStorage.setItem("endings", JSON.stringify(savedEndings));
            }
        }

        function replacePageWithEnding(ending, isJumpScare) {
            const bgColor = isJumpScare ? "black" : "white";
            const textColor = isJumpScare ? "white" : "black";
            document.documentElement.innerHTML = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>${ending}</title>
                    <style>
                        body {
                            background-color: ${bgColor};
                            color: ${textColor};
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            margin: 0;
                            font-family: Arial, sans-serif;
                            text-align: center;
                        }
                        h1 {
                            font-size: 2.5em;
                            margin-bottom: 20px;
                        }
                        button {
                            padding: 10px 20px;
                            font-size: 1em;
                            margin-top: 20px;
                            cursor: pointer;
                        }
                    </style>
                </head>
                <body>
                    <h1>${ending === finalEndingName ? "🎉 You won! 🎉" : `You got the ${ending}`}</h1>
                    ${ending === finalEndingName ? "<p>Congratulations! You've unlocked all endings!</p>" : ""}
                    <a href="calculator.html">
                        <button>Go Back</button>
                    </a>
                </body>
                </html>
            `;
        }

        function showEndings() {
            let savedEndings = JSON.parse(localStorage.getItem("endings")) || [];
            let totalEndings = Object.keys(endings).length;
            let popup = document.createElement("div");
            popup.style.position = "fixed";
            popup.style.top = "50%";
            popup.style.left = "50%";
            popup.style.transform = "translate(-50%, -50%)";
            popup.style.background = "white";
            popup.style.border = "2px solid black";
            popup.style.padding = "15px";
            popup.style.width = "300px";
            popup.style.height = "400px";
            popup.style.overflowY = "auto";
            popup.style.boxShadow = "0px 0px 10px rgba(0, 0, 0, 0.5)";
            popup.style.zIndex = "1000";
            let popupContent = `<strong>Unlocked Endings: ${savedEndings.length} / ${totalEndings}</strong><br><br>`;
            Object.values(endings).forEach(ending => {
                if (savedEndings.includes(ending)) {
                    popupContent += `<span style="color: black;">${ending}</span><br>`;
                } else {
                    popupContent += `<span style="color: red;">${ending}</span><br>`;
                }
            });
            if (savedEndings.includes(finalEndingName)) {
                popupContent += `<span style="color: gold;">${finalEndingName}</span><br>`;
            }
            let contentDiv = document.createElement("div");
            contentDiv.innerHTML = popupContent;
            popup.appendChild(contentDiv);
            let closeButton = document.createElement("button");
            closeButton.innerText = "Close";
            closeButton.onclick = () => document.body.removeChild(popup);
            popup.appendChild(closeButton);
            document.body.appendChild(popup);
        }

        function resetEndings() {
            if (confirm("Are you sure you want to delete all endings? This cannot be undone.")) {
                localStorage.removeItem("endings");
                alert("All endings have been deleted.");
            }
        }

        function checkForCompletion() {
            let savedEndings = JSON.parse(localStorage.getItem("endings")) || [];
            if (savedEndings.length === Object.keys(endings).length) {
                showCompletionCelebration();
            }
        }

        window.onload = function () {
            checkForCompletion();
            if (Math.random() < 0.10) { // 10% chance
                const mysteryTexts = [
                    "???",
                    "[subscribetomy]",
                    "[channel@josephasn]",
                    "[robot][uprising]",
                    "some endings are in plain sight"
                ];
        
                const inputId = Math.random() < 0.5 ? "input1" : "input2";
                const input = document.getElementById(inputId);
        
                if (input) {
                    input.value = mysteryTexts[Math.floor(Math.random() * mysteryTexts.length)];
                }
            }
        };
    </script>
</head>
<body>
    <div id="calculator">
        <h1>[Calculator] [Game]</h1>
        <p>This game is to get endings. Here's a [free] [one] --> [giveme] [ending] | (all ending has to be lowercase)</p>
        <input type="text" id="input1" placeholder="Enter first number">
        <input type="text" id="input2" placeholder="Enter second number">
        <button onclick="calculate()">Calculate</button>
        <p id="result"></p>
        <button onclick="showEndings()">View Endings</button>
        <button onclick="resetEndings()">Delete All Endings</button>
    </div>
    <footer style="text-align:center; padding:20px; font-size:14px; color:#555;">
      © 2026 welcometothiswebsite. All rights reserved.<br>
      <a href="/terms.html" style="color:#555; text-decoration:underline;">Terms of Use</a>
    </footer>
</body>
</html>
